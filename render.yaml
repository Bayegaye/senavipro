# Déploiement "Infrastructure as Code" sur Render (https://render.com).
# Sur Render : New -> Blueprint -> pointez vers ce dépôt/dossier.
# Crée automatiquement le service web (construit via Dockerfile) + une base
# PostgreSQL gratuite reliés. Utiliser Docker plutôt que le buildpack Python
# natif de Render évite les soucis de version Python par défaut trop récente
# (incompatible avec certaines dépendances compilées).
services:
  - type: web
    name: senavipro
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: senavipro-db
          property: connectionString

databases:
  - name: senavipro-db
    plan: free
