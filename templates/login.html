{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card card-stat p-4">
      <div class="text-center mb-3">
        <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="{{ app_name }}" style="width:110px;height:110px;object-fit:contain;border-radius:12px;">
        <h2 class="mt-2 mb-0">{{ app_name }}</h2>
        <p class="text-muted mb-0">Gestion des ventes et achats — œufs & poulets de chair</p>
      </div>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Identifiant</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Mot de passe</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Se connecter</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
